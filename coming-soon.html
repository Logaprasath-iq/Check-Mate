<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Next Move is Coming – CHECKMATE Chess Academy</title>
  <meta name="description" content="A revolutionary new online chess tournament and training experience is about to launch. Stay tuned.">
  <link rel="canonical" href="https://checkmate-academy.com/coming-soon.html">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, #151d30 0%, #080b12 80%);">

  <header style="padding: 2.5rem 0;">
    <div class="site-container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="site-logo">
          <img src="assets/images/logo-icon.png" alt="CHECKMATE Crest Logo" class="site-logo-img">
          <img src="assets/images/logo-text.png" alt="CHECKMATE - THINK. PLAY. MASTER." class="site-brand-img">
        </a>
      <a href="index.html" class="btn-secondary-outline" style="padding: 0.5rem 1.25rem; font-size: 0.8rem;">HOME</a>
    </div>
  </header>

  <main style="text-align: center; padding: 2rem 1.5rem;">
    <div class="site-container" style="max-width: 720px;">
      <div class="hero-eyebrow" style="margin-bottom: 1.5rem;">
        <span class="hero-eyebrow-dot"></span>
        GRAND LAUNCH
      </div>

      <h1 style="font-size: clamp(2.4rem, 4.5vw, 3.8rem); font-weight: 800; text-transform: uppercase; margin-bottom: 1.25rem;">
        OUR NEXT MOVE IS <span class="text-gold">COMING.</span>
      </h1>

      <p style="color: var(--text-secondary); font-size: 1.1rem; line-height: 1.7; margin-bottom: 3rem;">
        We are engineering a next-generation neural tournament platform, opening masterclasses, and global collegiate swiss arenas. Be the first to play.
      </p>

      <!-- Countdown Timer -->
      <div class="tournament-countdown-banner" data-countdown style="justify-content: center; background: rgba(14,20,34,0.7); max-width: 500px; margin: 0 auto 3rem;">
        <div class="countdown-digits">
          <div class="countdown-box">
            <div class="count-num count-days">28</div>
            <div class="count-unit">Days</div>
          </div>
          <div class="countdown-box">
            <div class="count-num count-hours">14</div>
            <div class="count-unit">Hours</div>
          </div>
          <div class="countdown-box">
            <div class="count-num count-mins">36</div>
            <div class="count-unit">Mins</div>
          </div>
          <div class="countdown-box">
            <div class="count-num count-secs">45</div>
            <div class="count-unit">Secs</div>
          </div>
        </div>
      </div>

      <!-- Email Notification Form -->
      <form onsubmit="event.preventDefault(); window.showCheckmateToast('You will be the first to know upon launch!', 'success');" style="display: flex; gap: 0.75rem; max-width: 480px; margin: 0 auto 2.5rem; flex-wrap: wrap;">
        <input type="email" placeholder="Enter your email for early access" class="newsletter-input" style="flex: 1; min-width: 220px;" required>
        <button type="submit" class="btn-primary-gold" style="padding: 0.8rem 1.5rem; justify-content: center;">
          NOTIFY ME
        </button>
      </form>

      <!-- Socials -->
      <div style="display: flex; justify-content: center; gap: 0.75rem;">
        <a href="#" class="tool-btn"><i data-lucide="twitter"></i></a>
        <a href="#" class="tool-btn"><i data-lucide="instagram"></i></a>
        <a href="#" class="tool-btn"><i data-lucide="youtube"></i></a>
        <a href="#" class="tool-btn"><i data-lucide="award"></i></a>
      </div>
    </div>
  </main>

  <footer style="padding: 2rem 0; text-align: center; border-top: 1px solid var(--border-subtle); font-size: 0.82rem; color: var(--text-muted);">
    &copy; 2026 CHECKMATE Academy. Strategic Expansion Pending.
  </footer>

  <script src="assets/js/main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
