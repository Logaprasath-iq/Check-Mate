<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student & Faculty Login – CHECKMATE Chess Academy</title>
  <meta name="description" content="Access your personalized chess student portal, live analysis engine, homework assignments, and tournament schedule.">
  <link rel="canonical" href="https://checkmate-academy.com/login.html">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
</head>
<body>

  <!-- Preloader -->
  <div id="site-preloader">
    <div class="preloader-king">
      <img src="assets/images/logo-icon.png" alt="CHECKMATE Preloader" style="width: 68px; height: auto; filter: drop-shadow(0 0 16px var(--gold-primary));">
    </div>
    <div class="preloader-brand">
      <img src="assets/images/logo-text.png" alt="CHECKMATE" style="height: 32px; width: auto;">
    </div>
    <div class="preloader-bar-bg"><div class="preloader-bar-fill"></div></div>
  </div>

  <!-- Floating Controls: Dark/Light Mode & RTL/LTR -->
  <div style="position: fixed; top: 1.5rem; inset-inline-end: 1.5rem; z-index: 1000; display: flex; align-items: center; gap: 0.75rem;">
    <button class="tool-btn theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme"><span class="theme-icon-slot"><i data-lucide="sun"></i></span></button>
    <button class="tool-btn rtl-toggle-btn" title="Toggle RTL / LTR" aria-label="Toggle RTL / LTR"><i data-lucide="arrow-left-right"></i><span class="rtl-label">RTL</span></button>
  </div>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; position: relative; background: radial-gradient(circle at center, #162035 0%, #07090e 75%);">
    <div class="cta-chess-bg"></div>

    <div style="max-width: 440px; width: 100%; background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius-lg); padding: 3rem 2.5rem; box-shadow: var(--shadow-lg); backdrop-filter: blur(20px); position: relative; z-index: 2;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="index.html" class="site-logo" style="margin-bottom: 0.75rem; display: inline-flex;">
          <img src="assets/images/logo-icon.png" alt="CHECKMATE Logo" class="site-logo-img">
          <img src="assets/images/logo-text.png" alt="CHECKMATE - THINK. PLAY. MASTER." class="site-brand-img">
        </a>
        <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary);">WELCOME BACK</h1>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Log in to access your portal, puzzles & live rooms</p>
      </div>

      <!-- Role Selector Tabs -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.25); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
        <button type="button" id="tab-student" onclick="selectRole('student')" style="padding: 0.55rem; font-size: 0.8rem; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; background: var(--gold-primary); color: #080b12; transition: var(--transition);">
          <i data-lucide="graduation-cap" style="width: 15px;"></i> Student
        </button>
        <button type="button" id="tab-admin" onclick="selectRole('admin')" style="padding: 0.55rem; font-size: 0.8rem; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; background: transparent; color: var(--text-muted); transition: var(--transition);">
          <i data-lucide="shield" style="width: 15px;"></i> Admin
        </button>
      </div>

      <form onsubmit="handleLoginSubmit(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div>
          <label id="email-label" style="display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.35rem; color: var(--text-secondary);">Student Email Address</label>
          <input type="email" id="login-email" class="newsletter-input" value="alex.morgan@checkmate.academy" placeholder="student@checkmate.academy" required>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Password</label>
            <a href="#" style="font-size: 0.75rem; color: var(--gold-primary);">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="newsletter-input" value="checkmate2026" placeholder="••••••••••••" required>
        </div>

        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary);">
          <input type="checkbox" id="remember" checked style="accent-color: var(--gold-primary);">
          <label for="remember">Remember this device for 30 days</label>
        </div>

        <button type="submit" id="btn-submit-login" class="btn-primary-gold" style="justify-content: center; padding: 0.85rem; width: 100%;">
          SIGN IN AS STUDENT <i data-lucide="log-in" style="width: 16px;"></i>
        </button>
      </form>

      <!-- Quick 1-Click Demo Login Helpers -->
      <div style="margin-top: 1.5rem; padding: 0.85rem; background: rgba(212, 175, 55, 0.06); border: 1px dashed var(--border-gold); border-radius: var(--radius-sm); text-align: center;">
        <span style="display: block; font-size: 0.72rem; font-weight: 700; color: var(--gold-light); text-transform: uppercase; margin-bottom: 0.5rem;">⚡ Instant 1-Click Demo Login</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" onclick="quickDemoLogin('student')" class="btn-login" style="font-size: 0.75rem; padding: 0.45rem; justify-content: center;">
            Student (Alex)
          </button>
          <button type="button" onclick="quickDemoLogin('admin')" class="btn-login" style="font-size: 0.75rem; padding: 0.45rem; justify-content: center;">
            Admin (Arjun)
          </button>
        </div>
      </div>

      <!-- Social Logins UI -->
      <div style="text-align: center; margin: 1.5rem 0 1.25rem; position: relative;">
        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-subtle);"></div>
        <span style="position: relative; background: var(--bg-card); padding: 0 0.75rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Or continue with</span>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <button class="btn-login" style="justify-content: center; gap: 0.5rem;" onclick="window.showCheckmateToast('Google SSO Activated', 'success')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg> Google
        </button>
        <button class="btn-login" style="justify-content: center; gap: 0.5rem;" onclick="window.showCheckmateToast('Chess.com SSO Connected', 'success')">
          <i data-lucide="award" style="width: 16px;"></i> Chess.com
        </button>
      </div>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-secondary);">
        Don't have an academy account yet?<br>
        <a href="register.html" style="color: var(--gold-light); font-weight: 700;">Enroll & Create Account &rarr;</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();

    let currentRole = 'student';

    function selectRole(role) {
      currentRole = role;
      const tabStudent = document.getElementById('tab-student');
      const tabAdmin = document.getElementById('tab-admin');
      const emailInput = document.getElementById('login-email');
      const emailLabel = document.getElementById('email-label');
      const submitBtn = document.getElementById('btn-submit-login');

      if (role === 'admin') {
        tabAdmin.style.background = 'var(--gold-primary)';
        tabAdmin.style.color = '#080b12';
        tabStudent.style.background = 'transparent';
        tabStudent.style.color = 'var(--text-muted)';
        emailLabel.textContent = 'Admin Email Address';
        emailInput.value = 'arjun.mehta@checkmate.academy';
        submitBtn.innerHTML = 'SIGN IN AS ADMIN <i data-lucide="shield" style="width: 16px;"></i>';
      } else {
        tabStudent.style.background = 'var(--gold-primary)';
        tabStudent.style.color = '#080b12';
        tabAdmin.style.background = 'transparent';
        tabAdmin.style.color = 'var(--text-muted)';
        emailLabel.textContent = 'Student Email Address';
        emailInput.value = 'alex.morgan@checkmate.academy';
        submitBtn.innerHTML = 'SIGN IN AS STUDENT <i data-lucide="log-in" style="width: 16px;"></i>';
      }
      lucide.createIcons();
    }

    function quickDemoLogin(role) {
      if (role === 'admin') {
        const user = { name: 'Arjun Mehta', role: 'admin', email: 'arjun.mehta@checkmate.academy' };
        localStorage.setItem('checkmate_user', JSON.stringify(user));
        window.showCheckmateToast('Welcome Chief Arbiter Arjun! Redirecting to Admin Dashboard...', 'success');
        setTimeout(() => { window.location.href = 'admin/index.html'; }, 800);
      } else {
        const user = { name: 'Alex Morgan', role: 'student', email: 'alex.morgan@checkmate.academy' };
        localStorage.setItem('checkmate_user', JSON.stringify(user));
        window.showCheckmateToast('Welcome back Alex! Redirecting to Student Dashboard...', 'success');
        setTimeout(() => { window.location.href = 'student/index.html'; }, 800);
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const role = currentRole || (email.toLowerCase().includes('admin') ? 'admin' : 'student');
      const name = role === 'admin' ? 'Arjun Mehta' : 'Alex Morgan';

      const user = { name, role, email };
      localStorage.setItem('checkmate_user', JSON.stringify(user));

      window.showCheckmateToast(`Login verified! Welcome ${name}`, 'success');
      setTimeout(() => {
        window.location.href = role === 'admin' ? 'admin/index.html' : 'student/index.html';
      }, 900);
    }
  </script>
</body>
</html>
